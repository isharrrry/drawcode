[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawcode"
version = "0.1.0"
description = "Bidirectional signal-flow diagrams where source code is the single source of truth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Documentation",
]

[project.scripts]
drawcode = "drawcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
